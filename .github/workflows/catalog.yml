name: Catalogo Brikivio - aggiornamento dati
on:
  workflow_dispatch:
  schedule:
    - cron: '23 5 * * *'
permissions:
  contents: read
concurrency:
  group: brikivio-public-catalog
  cancel-in-progress: false
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - run: python scripts/build-catalog-feed.py
      - name: Prepara informative pubbliche
        run: |
          mkdir -p catalog-site/privacy catalog-site/licenses
          cp privacy.html catalog-site/privacy/index.html
          cp licenses.html catalog-site/licenses/index.html
      - uses: actions/upload-pages-artifact@v4
        with:
          path: catalog-site
  publish:
    needs: prepare
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Pubblica catalogo e informative
        id: deployment
        uses: actions/deploy-pages@v4
